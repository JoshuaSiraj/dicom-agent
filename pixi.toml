[workspace]
authors = ["Joshua Siraj <joshua.siraj@ryerson.ca>"]
channels = ["conda-forge"]
name = "dicom-agent"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
serve = "python -m dicom_agent.serve"

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<3"
simpleitk = ">=2.3"

[pypi-dependencies]
google-adk = ">=1.0"
google-genai = ">=1.0"
litellm = ">=1.84"
mcp = ">=2.3.0, <3"
python-dotenv = ">=1.0"
